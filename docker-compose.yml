# Fallback deployment: the whole game (MySQL + built server/client) in
# Docker. The default workflow is docker-less — a local MySQL install plus
# `npm run dev` / `npm start` (see README) — use this only when you want
# everything containerized instead.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tank
      MYSQL_USER: tank
      MYSQL_PASSWORD: tank
      MYSQL_ROOT_PASSWORD: tank
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'tank', '-ptank']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://tank:tank@mysql:3306/tank
      SESSION_SECRET: change-me-to-a-long-random-string
    ports:
      - '5000:5000'

volumes:
  mysql-data:
