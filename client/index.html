<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pixel Tanks Battle — Free Online Multiplayer Tank Game</title>
    <meta
      name="description"
      content="Play Pixel Tanks Battle — a free browser multiplayer tank game. Fight real-time PvP duels or defend your base in co-op waves against bot armies on pixel-art arenas. No download needed."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#323137" />

    <link rel="canonical" href="https://pixel-tanks-battle.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixel Tanks Battle" />
    <meta property="og:title" content="Pixel Tanks Battle — Free Online Multiplayer Tank Game" />
    <meta
      property="og:description"
      content="Real-time PvP tank duels and co-op base defense against bot waves on pixel-art arenas. Playable in the browser, no download."
    />
    <meta property="og:image" content="/ui/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pixel Tanks Battle — Free Online Multiplayer Tank Game" />
    <meta
      name="twitter:description"
      content="Real-time PvP tank duels and co-op base defense against bot waves on pixel-art arenas. Playable in the browser, no download."
    />
    <meta name="twitter:image" content="/ui/og-banner.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Pixel Tanks Battle",
        "description": "Free online multiplayer pixel-art tank game: real-time PvP battles and co-op base defense against bot waves, playable in the browser.",
        "genre": ["Action", "Multiplayer", "Arcade"],
        "playMode": ["MultiPlayer", "CoOp"],
        "applicationCategory": "Game",
        "operatingSystem": "Web",
        "gamePlatform": "Web Browser"
      }
    </script>

    <link rel="icon" href="/favicon.ico" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <div class="site">
      <!-- Прелоадер: пока проверяем сессию, чтобы не мелькала форма входа -->
      <div id="preloader">
        <div class="screen">
          <div class="field pixel-ui">
            <h1 class="title">TANK BATTLE</h1>
            <p class="tagline preloader-text">Loading&hellip;</p>
          </div>
        </div>
      </div>

      <!-- Экран загрузки матча: висит, пока не придут арена и первый снапшот -->
      <div id="match-loader" class="hidden">
        <div class="screen">
          <div class="field pixel-ui">
            <h1 class="title">TANK BATTLE</h1>
            <p class="tagline preloader-text">Deploying&hellip;</p>
          </div>
        </div>
      </div>

      <!-- Screens (auth/lobby/create-room/editor/account) and the match/settings
           modals inject their own markup here on first show — see each page's
           co-located *.html partial under src/pages/. -->
      <div id="page-mounts"></div>

      <!-- Игровой контейнер: always in the DOM (not a lazily-injected partial)
           — .match-layout > .side is a structural CSS dependency (style.css),
           and mobileLayout.ts relocates nodes in/out of it at app boot. -->
      <div class="wrapper">
        <div class="match-layout">
          <main class="arena-shell">
            <div id="root"></div>
            <div id="rank-card" class="rank-card hidden">
              <div class="rank-card-icon" aria-hidden="true">
                <i></i><i></i><i></i> <i></i><i></i><i></i> <i></i><i></i><i></i>
              </div>
              <div>
                <p class="rank-card-name" id="rank-card-name"></p>
                <p class="rank-card-rank" id="rank-card-rank"></p>
              </div>
            </div>
          </main>

          <aside id="match-hud" class="side hidden pixel-ui">
            <div class="top-actions">
              <button type="button" class="btn o" id="leave-match-btn">LEAVE MATCH</button>
              <button type="button" class="btn o" id="settings-btn">SETTINGS</button>
            </div>

            <section class="hud-panel hud-panel--wood" id="side-roster-panel">
              <div id="match-status-body"></div>
            </section>

            <section class="hud-panel hud-panel--steel hud-panel--map" id="side-map-panel">
              <canvas id="minimap-canvas"></canvas>
            </section>

            <!-- Чат кімнати (лишається видимим і під час бою) -->
            <section class="hud-panel hud-panel--steel hud-panel--chat hidden" id="chat-panel">
              <div id="chat-log"></div>
              <form id="chat-form">
                <div class="chat-input-row">
                  <input
                    type="text"
                    id="chat-input"
                    maxlength="200"
                    placeholder="Say something..."
                    autocomplete="off"
                  />
                  <button
                    type="button"
                    id="chat-emoji-btn"
                    class="chat-emoji-btn"
                    aria-label="Insert emoji"
                  >
                    &#128512;
                  </button>
                  <div id="chat-emoji-picker" class="chat-emoji-picker hidden"></div>
                </div>
                <button type="submit" class="btn o chat-send-btn">Send</button>
              </form>
            </section>
          </aside>
        </div>

        <!-- Мобільний док: чат під полем + керування -->
        <div id="mobile-dock">
          <section id="chat-dock" class="hidden"></section>

          <div id="mobile-controls">
            <div class="dpad">
              <button type="button" class="mc-btn dpad-up" data-move="movePieceTop" aria-label="Up">
                &#9650;
              </button>
              <button
                type="button"
                class="mc-btn dpad-left"
                data-move="movePieceLeft"
                aria-label="Left"
              >
                &#9664;
              </button>
              <button
                type="button"
                class="mc-btn dpad-right"
                data-move="movePieceRight"
                aria-label="Right"
              >
                &#9654;
              </button>
              <button
                type="button"
                class="mc-btn dpad-down"
                data-move="movePieceBottom"
                aria-label="Down"
              >
                &#9660;
              </button>
            </div>

            <div class="mc-right">
              <div class="mc-toggles">
                <button type="button" class="btn o" id="mc-map-toggle">MAP</button>
                <button type="button" class="btn o" id="mc-players-toggle">TEAM</button>
                <button type="button" class="btn o" id="mc-chat-toggle">CHAT</button>
                <button type="button" class="btn o" id="mc-settings-toggle">SETUP</button>
                <button type="button" class="btn o mc-exit" id="mc-exit">EXIT</button>
              </div>
              <button type="button" id="mc-fire" aria-label="Fire">FIRE</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Мобільні модалки: карта і список гравців. Static (not lazily
           injected) — mobileLayout.ts's initMobileLayout() reparents nodes
           into these at app boot, before any route/page has run. -->
      <div id="map-modal" class="hidden modal-backdrop pixel-ui">
        <div class="match-modal-box mobile-modal-box">
          <span class="deco tl"></span><span class="deco tr"></span> <span class="deco bl"></span
          ><span class="deco br"></span>
          <div class="tab"><h2 class="o">MAP</h2></div>
          <div id="modal-minimap-host" class="well"></div>
          <button type="button" class="btn o mobile-modal-close" data-close-modal>CLOSE</button>
        </div>
      </div>

      <div id="players-modal" class="hidden modal-backdrop pixel-ui">
        <div class="match-modal-box mobile-modal-box">
          <span class="deco tl"></span><span class="deco tr"></span> <span class="deco bl"></span
          ><span class="deco br"></span>
          <div class="tab"><h2 class="o">PLAYERS</h2></div>
          <div id="modal-roster-host" class="well"></div>
          <button type="button" class="btn o mobile-modal-close" data-close-modal>CLOSE</button>
        </div>
      </div>
    </div>

    <div class="site-frame" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
