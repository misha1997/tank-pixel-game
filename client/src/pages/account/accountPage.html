<div id="account-overlay" class="hidden">
  <div class="screen">
    <div class="field pixel-ui">
      <div class="panel">
        <span class="deco tl"></span><span class="deco tr"></span> <span class="deco bl"></span
        ><span class="deco br"></span>
        <div class="tab"><h1 class="o">ACCOUNT</h1></div>
        <div id="account-status" class="whoami o"></div>

        <div class="well">
          <label class="lbl o" for="account-name">Login:</label>
          <input
            class="field-input"
            id="account-name"
            maxlength="12"
            placeholder="Warrior"
            autocomplete="username"
          />
          <div class="account-hint o">3&ndash;12 characters, English letters and digits</div>

          <label class="lbl o">Tank Color:</label>
          <div class="color-palette" id="account-colors">
            <div
              class="color-option"
              data-color="#ffffff"
              style="background-color: #ffffff"
              title="White"
            ></div>
            <div
              class="color-option"
              data-color="#04847c"
              style="background-color: #04847c"
              title="Teal"
            ></div>
            <div
              class="color-option"
              data-color="#c20000"
              style="background-color: #c20000"
              title="Red"
            ></div>
            <div
              class="color-option"
              data-color="#007f9b"
              style="background-color: #007f9b"
              title="Blue"
            ></div>
            <div
              class="color-option"
              data-color="#ab8f00"
              style="background-color: #ab8f00"
              title="Yellow"
            ></div>
            <div
              class="color-option"
              data-color="#FF8B94"
              style="background-color: #ff8b94"
              title="Pink"
            ></div>
            <div
              class="color-option"
              data-color="#3100ab"
              style="background-color: #3100ab"
              title="Purple"
            ></div>
          </div>

          <div id="account-password-fields" class="hidden">
            <label class="lbl o" for="account-current-password">Current Password:</label>
            <input
              class="field-input"
              type="password"
              id="account-current-password"
              autocomplete="current-password"
            />

            <label class="lbl o" for="account-new-password"
              >New Password (leave empty to keep):</label
            >
            <input
              class="field-input"
              type="password"
              id="account-new-password"
              autocomplete="new-password"
            />
          </div>

          <div id="account-error" class="err o" role="alert"></div>

          <button class="btn o" type="button" id="account-save">SAVE</button>
          <button class="guest o" type="button" id="account-back-btn">&larr; Back to Lobby</button>
        </div>
      </div>
    </div>
  </div>
</div>
