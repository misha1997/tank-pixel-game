@media (max-width:1300px){ :root{ --s:4px } }
@media (max-width:1050px){ :root{ --s:3px } }
@media (max-width:800px){  :root{ --s:2px } }

*{ margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }

body{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:calc(var(--s)*20) calc(var(--s)*3);
  background:#8b8f6c var(--spr-bg) 0 0/calc(var(--s)*14) calc(var(--s)*14);
  font-family:'Jersey 25',ui-monospace,monospace;
  font-size:calc(var(--s)*15.25);
  line-height:1;
  letter-spacing:-.05em;
  color:var(--text);
  -webkit-font-smoothing:none;
}

/* обводка текста в 1 логический пиксель */
.o{
  text-shadow:
    var(--s) 0 0 var(--ink), calc(var(--s)*-1) 0 0 var(--ink),
    0 var(--s) 0 var(--ink), 0 calc(var(--s)*-1) 0 var(--ink),
    var(--s) var(--s) 0 var(--ink), calc(var(--s)*-1) var(--s) 0 var(--ink),
    var(--s) calc(var(--s)*-1) 0 var(--ink), calc(var(--s)*-1) calc(var(--s)*-1) 0 var(--ink);
}

/* ---------------------------------------------------------------- корпус */
.panel{
  position:relative;
  width:calc(var(--s)*239); max-width:100%;
  margin-top:calc(var(--s)*12);
  padding:calc(var(--s)*12) 0 0;
  border:calc(var(--s)*8) solid transparent;
  border-image:var(--spr-panel) 8 fill stretch;
}
.deco{
  position:absolute; width:calc(var(--s)*24); height:calc(var(--s)*8);
  background:var(--spr-deco) 0 0/100% 100% no-repeat;
  opacity:.6; pointer-events:none;
}
.deco.tl{ left:calc(var(--s)*-5); top:calc(var(--s)*-5); }
.deco.tr{ right:calc(var(--s)*-5); top:calc(var(--s)*-5); transform:scaleX(-1); }
.deco.bl{ left:calc(var(--s)*-5); bottom:calc(var(--s)*-5); transform:scaleY(-1); }
.deco.br{ right:calc(var(--s)*-5); bottom:calc(var(--s)*-5); transform:scale(-1,-1); }

/* ------------------------------------------------------- вкладка + титул */
.tab{
  position:absolute; left:50%; top:calc(var(--s)*-20);
  transform:translateX(-50%);
  max-width:calc(100% + var(--s)*16);
  padding:0 calc(var(--s)*11);
  border:solid transparent;
  border-width:calc(var(--s)*13) calc(var(--s)*16) 0;
  border-image:var(--spr-tab) 13 16 0 16 fill stretch;
}
.tab h1{
  margin-top:calc(var(--s)*-6.45);
  font-size:calc(var(--s)*23);
  font-weight:400;
  white-space:nowrap;
}

/* ------------------------------------------------------------- колодец */
.well{
  border:calc(var(--s)*3) solid transparent;
  border-image:var(--spr-inset) 3 fill stretch;
  padding:calc(var(--s)*9) calc(var(--s)*8) calc(var(--s)*6);
  display:flex; flex-direction:column; gap:calc(var(--s)*5);
}

/* --------------------------------------------------------- поле ввода */
.field{
  width:100%; height:calc(var(--s)*23);
  margin-bottom:calc(var(--s)*2);
  padding:0 calc(var(--s)*5);
  font:inherit; letter-spacing:inherit; text-transform:uppercase;
  color:var(--typed); caret-color:var(--typed);
  background:none; outline:none; -webkit-appearance:none;
  border:calc(var(--s)*2) solid transparent;
  border-image:var(--spr-input) 2 fill stretch;
}
.field::placeholder{ color:var(--placeholder); opacity:1; }
.field:focus{ box-shadow:inset 0 0 0 var(--s) #cfd3d6; }

/* --------------------------------------------------------------- кнопки */
.btn{
  font:inherit; letter-spacing:inherit; color:var(--text);
  height:calc(var(--s)*26);
  padding:0 calc(var(--s)*6);
  display:inline-flex; align-items:center; justify-content:center;
  background:none; cursor:pointer;
  border:calc(var(--s)*3) solid transparent;
  border-image:var(--spr-btn) 3 fill stretch;
}
.btn:hover{ border-image-source:var(--spr-btn-h); }
.btn:active{ border-image-source:var(--spr-btn-a); transform:translate(var(--s),var(--s)); }
.btn:focus-visible{ outline:var(--s) solid #fff; outline-offset:calc(var(--s)*-1); }
.btn[disabled]{ filter:grayscale(.7) brightness(.8); cursor:not-allowed; }
@media (prefers-reduced-motion:reduce){ .btn:active{ transform:none } }

.btn-row{ display:flex; gap:calc(var(--s)*7); }
.btn-row .btn{ flex:1 1 0; min-width:0; }
.btn.wide{ width:100%; }

@media (max-width:560px){
  .btn-row{ flex-direction:column; }
}
</style>
</head>
<body>

<div class="panel">
  <span class="deco tl"></span><span class="deco tr"></span>
  <span class="deco bl"></span><span class="deco br"></span>

  <div class="tab"><h1 class="o">PRIVATE ROOM</h1></div>

  <div class="well">
    <input class="field" id="code" type="text" placeholder="CODE"
           maxlength="8" autocomplete="off" spellcheck="false" aria-label="Room code">
    <div class="btn-row">
      <button class="btn o" type="button" data-action="create">CREATE</button>
      <button class="btn o" type="button" data-action="join">JOIN BY CODE</button>
    </div>
  </div>
</div>

<script>
const code = document.getElementById('code');
const joins = [...document.querySelectorAll('[data-action="join"]')];

/* код — только буквы и цифры, в верхнем регистре */
code.addEventListener('input', () => {
  const pos = code.selectionStart;
  code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  code.setSelectionRange(pos, pos);
  sync();
});

function sync(){ joins.forEach(b => b.disabled = code.value.length === 0); }
sync();

document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => {
  console.log(b.dataset.action, code.value);   // сюда подставьте свой обработчик
}));
</script>
</body>
</html>
